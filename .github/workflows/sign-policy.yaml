name: Sign In-Toto Policy Manual Workflow

on:
  workflow_dispatch:
    inputs:
      policy_path:
        description: "Path to unsigned policy file"
        required: true
        default: "security/policy/in-toto.json"
      output_path:
        description: "Destination path for signed policy"
        required: true
        default: "security/policy/in-toto.signed.json"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sign-policy:
    name: Sign & Update In-Toto Layout Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL \
            -o witness.tar.gz \
            "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Show Witness CLI
        run: |
          witness version
          witness sign --help

      - name: Sign Policy (Keyless via Sigstore)
        run: |
          set -euo pipefail

          ACTIONS_ID_TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r '.value')

          witness sign \
            -f "${{ inputs.policy_path }}" \
            --signer-fulcio-url "https://fulcio.sigstore.dev" \
            --signer-fulcio-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signer-fulcio-token "$ACTIONS_ID_TOKEN" \
            -o "${{ inputs.output_path }}"

      - name: Verify Signed Envelope Structure
        run: |
          if [ ! -s "${{ inputs.output_path }}" ]; then
            echo "❌ Policy signing failed or generated empty output file."
            exit 1
          fi
          echo "✅ Policy successfully signed:"
          jq -e '.payloadType and .payload and .signatures' "${{ inputs.output_path }}"

      - name: Create Pull Request with Updated Policy
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #8.1.1
        with:
          commit-message: "security(policy): update signed in-toto policy layout"
          title: "security: Update Signed In-Toto Policy (`policy.signed.json`)"
          body: |
            Automated pull request triggered by `@${{ github.actor }}` to update the signed in-toto/Witness policy layout.
            
            **Input File:** `${{ inputs.policy_path }}`
            **Output File:** `${{ inputs.output_path }}`
          branch: "automation/update-signed-policy"
          delete-branch: true
          labels: |
            security
            automated-pr