name: Verify Release Security

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Cryptographic & Vulnerability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install SLSA Verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.6.0

      - name: Verify Cosign Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"

      - name: Verify Attestation Signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}"

      - name: Verify SLSA Provenance
        run: |
          slsa-verifier verify-image \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}" \
            --source-uri "github.com/${{ github.repository }}" \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref_name }}"

      - name: Scan Deployed Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Deployed Image with Grype
        uses: anchore/scan-action@v3
        with:
          image: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"
          fail-build: true
          severity-cutoff: high

      - name: Scan package-lock with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.8.4
        with:
          scan-args: --lockfile=package-lock.json