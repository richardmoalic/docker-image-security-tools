name: Production Release & Tag Execution

on:
  release:
    types: 
      - published

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  publish:
    name: Final Promotion & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      target_image: ${{ steps.resolve-digest.outputs.target_image }}
      attestation_path: ${{ steps.witness-publish.outputs.attestation_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Security Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Attest Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attest-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Verify Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verify-artifacts
          path: ${{ env.ARTIFACTS_DIR }}


      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version & SHA Digest
        id: resolve-digest
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          
          git fetch --tags

          COMMIT_SHA=$(git rev-list -n 1 "${{ github.event.release.tag_name }}")
          SHORT_SHA=$(git rev-parse --short=7 "$COMMIT_SHA")
          
          CANDIDATE_TAG="sha-${SHORT_SHA}"
          TARGET_IMAGE="${REGISTRY}/${IMAGE}:${CANDIDATE_TAG}"
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "target_image=${TARGET_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "TARGET_IMAGE=${TARGET_IMAGE}" >> "$GITHUB_ENV"

      - name: Install Crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Tag OCI Manifest in Registry via Crane (Promote)
        run: |
          crane tag "$TARGET_IMAGE" "${{ steps.resolve-digest.outputs.version }}"
          crane tag "$TARGET_IMAGE" "latest"

      - name: Prepare Workspace Directory
        run: mkdir -p "$ARTIFACTS_DIR"

      - name: Generate Tool Manifest
        run: |
          cat <<EOF > "$ARTIFACTS_DIR/manifest.json"
          {
            "version": "${{ steps.resolve-digest.outputs.version }}",
            "built": "$(date -u +'%Y-%m-%d')",
            "tools": {
              "cosign": "3.0.5",
              "trivy": "0.72.0",
              "syft": "1.46.0",
              "grype": "0.115.0",
              "osv-scanner": "2.4.0",
              "vexctl": "c613023a69ce990a54c25c2f5e69d5d78285927f",
              "witness": "0.12.0",
              "slsa-verifier": "2.4.1"
            }
          }
          EOF

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL -o witness.tar.gz "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Generate Publish Step Attestation (Witness)
        id: witness-publish
        run: |
          ATTESTATION_FILE="$ARTIFACTS_DIR/witness-publish.dsse.json"
          witness run \
            --step publish \
            --outfile "$ATTESTATION_FILE" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- bash -c "echo 'Promoted ${{ env.TARGET_IMAGE }} to tag ${{ steps.resolve-digest.outputs.version }}'"

          echo "attestation_path=$ATTESTATION_FILE" >> "$GITHUB_OUTPUT"

      - name: Attach Manifest & Attestation to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: github.event_name == 'release'
        with:
          tag_name: ${{ steps.resolve-digest.outputs.version }}
          files: |
            ${{ env.ARTIFACTS_DIR }}/manifest.json
            ${{ env.ARTIFACTS_DIR }}/witness-publish.dsse.json