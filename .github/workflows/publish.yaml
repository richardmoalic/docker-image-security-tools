name: Production Release & Tag Execution

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    name: Final Promotion & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch Remote Tags
        run: git fetch --tags --force

      - name: Download Security Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          name: security-artifacts
          path: ./artifacts

      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crane to Promote Tags Without Rebuilding
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      # Promote the secure, verified image to production tags cleanly
      - name: Tag OCI Manifest in Registry
        run: |
          crane tag "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}" "${{ inputs.version }}"
          crane tag "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}" "latest"

      - name: Generate Tool Manifest
        run: |
          cat <<EOF > manifest.json
          {
            "version": "${{ inputs.version }}",
            "built": "$(date -u +'%Y-%m-%d')",
            "tools": {
              "cosign": "3.0.5",
              "trivy": "0.72.0",
              "syft": "1.46.0",
              "grype": "0.115.0",
              "osv-scanner": "2.4.0",
              "vexctl": "0.4.1",
              "witness": "0.7.0",
              "slsa-verifier": "2.4.1"
            }
          }
          EOF

      # Tag the source repository now that the artifact is fully proven compliant
      - name: Create and Push Git Production Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            git tag "${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #3.0.2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            manifest.json
            ./artifacts/checksums.txt
            ./artifacts/sbom.spdx.json
            ./artifacts/sbom.cdx.json
            ./artifacts/grype-filtered.sarif
            ./artifacts/grype.json
            ./artifacts/trivy.json
            ./artifacts/trivy-filtered.sarif
            ./artifacts/osv.json
            ./artifacts/vex.json
            ./artifacts/witness.dsse.json