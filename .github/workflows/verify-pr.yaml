name: Verify Pull Request

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/verify-pr.yml'

jobs:
  verify:
    name: Verify Tool-Suite Build & Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #4.2.0

      - name: Build Local Verification Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #7.3.0
        with:
          context: .
          load: true
          tags: sec-tools:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Binary Execution
        run: |
          echo "=== Verifying Hardened Toolchain ==="
          docker run --rm sec-tools:test --version
          docker run --rm --entrypoint cosign sec-tools:test version
          docker run --rm --entrypoint syft sec-tools:test --version
          docker run --rm --entrypoint grype sec-tools:test version
          docker run --rm --entrypoint witness sec-tools:test version
          docker run --rm --entrypoint slsa-verifier sec-tools:test version