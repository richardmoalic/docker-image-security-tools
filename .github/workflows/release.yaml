name: Production Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      ############################################################
      # Checkout
      ############################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # Versioning
      ############################################################

      - name: Install svu
        run: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt-get update && sudo apt-get install svu -y

      # Determine the next semantic tag and push it
      - name: Determine Next Version
        id: semver
        run: |
          NEXT_VERSION=$(svu next)
          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          
          # Configure Git to push the new tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Apply and push the tag if it doesn't exist
          if ! git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            git tag "$NEXT_VERSION"
            git push origin "$NEXT_VERSION"
          else
            echo "Tag $NEXT_VERSION already exists locally/remotely."
          fi

      ############################################################
      # Tool Manifest
      ############################################################

      # Generate the machine-readable JSON manifest
      - name: Generate Tool Manifest
        run: |
          cat <<EOF > manifest.json
          {
            "version": "${{ steps.semver.outputs.version }}",
            "built": "$(date -u +'%Y-%m-%d')",
            "tools": {
              "cosign": "2.4.1",
              "trivy": "0.72.0",
              "syft": "1.46.0",
              "grype": "0.115.0",
              "osv-scanner": "2.4.0",
              "vexctl": "0.4.1",
              "witness": "0.7.0",
              "slsa-verifier": "2.4.1"
            }
          }
          EOF

      # Upload the manifest so it can be referenced or packaged later
      - name: Upload Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-manifest
          path: manifest.json

      ############################################################
      # Login
      ############################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ############################################################
      # Buildx
      ############################################################

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      ############################################################
      # Metadata
      ############################################################

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      ############################################################
      # Build Runtime Image
      ############################################################

      - name: Build & Push Runtime Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      ############################################################
      # Export Artifact Stage
      ############################################################

      - name: Export Security Artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          outputs: type=local,dest=artifacts
          cache-from: type=gha

      ############################################################
      # Cosign
      ############################################################

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      ############################################################
      # Attach OCI Artifacts
      ############################################################

      - name: Attach SPDX SBOM
        run: |
          cosign attach sbom \
            --sbom artifacts/sbom.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach CycloneDX SBOM
        run: |
          cosign attest --yes \
            --predicate artifacts/sbom.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach Syft Inventory
        run: |
          cosign attest --yes \
            --predicate artifacts/syft.json \
            --type syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach Grype Report
        run: |
          cosign attest --yes \
            --predicate artifacts/grype.json \
            --type vuln \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach Trivy Report
        run: |
          cosign attest --yes \
            --predicate artifacts/trivy.json \
            --type vuln \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach OSV Report
        run: |
          cosign attest --yes \
            --predicate artifacts/osv.json \
            --type osv \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach OpenVEX
        run: |
          cosign attest --yes \
            --predicate artifacts/vex.json \
            --type openvex \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attach Witness Evidence
        run: |
          cosign attest --yes \
            --predicate artifacts/witness.dsse.json \
            --type https://witness.dev/attestation/v0.1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      ############################################################
      # GitHub Native Attestations
      ############################################################

      - name: Publish SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub SBOM Attestation
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: artifacts/sbom.spdx.json
          push-to-registry: true