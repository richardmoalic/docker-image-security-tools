name: Security Scanning & Artifact Generation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-and-scan:
    name: Build, Scan & Attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Initialize Cache Directories
        run: mkdir -p ~/.cache/trivy ~/.cache/grype

      # Set up caching for vulnerability databases
      - name: Cache Vulnerability Databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #6.1.0
        with:
          path: |
            ~/.cache/trivy
            ~/.cache/grype
          key: ${{ runner.os }}-security-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-security-db-

      - name: Build Tool-Suite Image
        run: |
          docker build \
            -t sec-tools:local \
            --target runtime \
            .

      - name: Prepare Workspace Directories
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          mkdir -p ~/.cache/trivy ~/.cache/grype

      # Extract generated SBOMs
      - name: Extract Build Metadata
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint cp \
            sec-tools:local -r /artifacts/. /host-artifacts/

      # Run Grype Scan
      - name: Run Grype Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/grype \
            sec-tools:local sbom:/host-artifacts/sbom.spdx.json -o json > ${{ github.workspace }}/security-artifacts/grype.json

      - name: Run Grype Sarif Report
        run: |
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/grype \
            sec-tools:local sbom:/host-artifacts/sbom.spdx.json -o sarif > ${{ github.workspace }}/security-artifacts/grype.sarif

      # Run Trivy Scan
      - name: Run Trivy Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/trivy \
            sec-tools:local sbom /host-artifacts/sbom.cdx.json --format json --output /host-artifacts/trivy.json
      
      - name: Generate Trivy SARIF Report
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/trivy \
            sec-tools:local sbom /host-artifacts/sbom.cdx.json --format sarif --output /host-artifacts/trivy.sarif

      # Run OSV-Scanner
      - name: Run OSV-Scanner
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/osv-scanner \
            sec-tools:local --sbom /host-artifacts/sbom.spdx.json --format json > ${{ github.workspace }}/security-artifacts/osv.json

      - name: Extract Product PURL
        id: product
        run: |
          PURL=$(jq -r '.metadata.component.purl // empty' "${{ github.workspace }}/build-artifacts/sbom.cdx.json")

          if [ -z "$PURL" ] || [ "$PURL" = "null" ]; then
            echo "⚠️ PURL not found in SBOM metadata. Building clean fallback..."
            REGISTRY_PATH="${{ env.REGISTRY }}/${{ env.IMAGE }}"
            IDENTIFIER="${{ inputs.image_digest || github.sha }}"
            PURL=$(echo "pkg:oci/${REGISTRY_PATH}@${IDENTIFIER}" | tr '[:upper:]' '[:lower:]')
          fi

          echo "Final target PURL for VEX: $PURL"
          echo "purl=$PURL" >> "$GITHUB_OUTPUT"

      # Prepare OpenVEX Policy
      - name: Prepare VEX Policy
        run: |
          jq \
            --arg purl "${{ steps.product.outputs.purl }}" \
            '
            .statements |= map(
              .products = [{ "@id": $purl }]
            )
            ' \
            security/policy/vex-policy.json \
            > "${{ github.workspace }}/security-artifacts/vex.json"


      # Apply VEX Filtering
      - name: Filter Trivy SARIF with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              /host-artifacts/trivy.sarif \
              /host-artifacts/vex.json \
              > ${{ github.workspace }}/security-artifacts/trivy-filtered.sarif
              

      - name: Filter Grype Results with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              /host-artifacts/grype.sarif \
              /host-artifacts/vex.json \
              > ${{ github.workspace }}/security-artifacts/grype-filtered.sarif


      - name: Verify Filtered Security Gates
        run: |
          echo "### Security Compliance Metadata" >> $GITHUB_STEP_SUMMARY
          echo "Evaluating remaining vulnerabilities after VEX statements applied..."
          
          TRIVY_BEFORE=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/security-artifacts/trivy.sarif 2>/dev/null || echo "0")
          TRIVY_AFTER=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/security-artifacts/trivy-filtered.sarif 2>/dev/null || echo "0")
          GRYPE_BEFORE=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/security-artifacts/grype.sarif 2>/dev/null || echo "0")
          GRYPE_AFTER=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/security-artifacts/grype-filtered.sarif 2>/dev/null || echo "0")
          
          echo "#### Scanner Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Engine | Findings Before VEX | Findings After VEX |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------------------:|-------------------:|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy** | $TRIVY_BEFORE | $TRIVY_AFTER |" >> $GITHUB_STEP_SUMMARY
          echo "| **Grype** | $GRYPE_BEFORE | $GRYPE_AFTER |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Compliance logging finished. This phase is non-blocking; all details are saved to artifacts." >> $GITHUB_STEP_SUMMARY

      # Generate Witness Evidence
      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL \
            -o witness.tar.gz \
            "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"

          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      # Generate Process Attestation (Witness)
      - name: Generate Security Scan Step Attestation (Witness)
        run: |
          witness run \
            --step security-scan \
            --outfile "${{ github.workspace }}/security-artifacts/witness-security-scan.dsse.json" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- true


      - name: Generate Checksums
        run: |
          cd ${{ github.workspace }}/artifacts
          
          shopt -s nullglob
          sha256sum *.{json,sarif} > checksums.txt
          shopt -u nullglob

      - name: Generate Checksums Predicate
        run: |
          cd ${{ github.workspace }}/artifacts
          
          shopt -s nullglob
          sha256sum *.{json,sarif} | jq -R -s --arg ver "${{ inputs.version }}" '
            split("\n") | map(select(length > 0) | split("  ")) | map({(.[1]): .[0]}) | add
            | { version: $ver, artifacts: . }
          ' > checksums.json
          shopt -u nullglob

      - name: Install Cosign
        uses: sigstore/cosign-installer@d8b3cd6632491afc8f196c55b178864f5b957fd7 # v3.8.1


      - name: Sign Checksums File
        run: |
          cosign sign-blob \
            --yes \
            --output-signature "${{ github.workspace }}/security-artifacts/checksums.txt.sigstore" \
            "${{ github.workspace }}/artifacts/checksums.txt"


      - name: Upload Security Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: security-artifacts
          path: ${{ github.workspace }}/security-artifacts/
          retention-days: 5
