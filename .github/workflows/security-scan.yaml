name: Security Scanning & Artifact Generation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

    outputs:
      purl:
        description: "The product PURL evaluated for VEX policy filtering"
        value: ${{ jobs.scan.outputs.purl }}
      attestation_path:
        description: "The local path to the generated Witness DSSE attestation"
        value: ${{ jobs.scan.outputs.attestation_path }}

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  TRIVY_CACHE_DIR: /tmp/.cache/trivy
  GRYPE_CACHE_DIR: /tmp/.cache/grype

jobs:
  scan:
    name: Scan & Attest
    runs-on: ubuntu-latest
    env:
      TARGET_IMAGE: ghcr.io/${{ github.repository }}@${{ inputs.image_digest }}
    outputs:
      purl: ${{ steps.product.outputs.purl }}
      attestation_path: ${{ steps.witness-attestation.outputs.attestation_path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare Workspace Directories
        run: |
          mkdir -p "$ARTIFACTS_DIR" "$TRIVY_CACHE_DIR" "$GRYPE_CACHE_DIR"

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Vulnerability Databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRIVY_CACHE_DIR }}
            ${{ env.GRYPE_CACHE_DIR }}
          key: ${{ runner.os }}-security-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-security-db-

      # Direct scanning against the immutable remote OCI digest or exported SBOMs
      - name: Run Grype Scan
        run: |
          docker run --rm \
            -v "$GRYPE_CACHE_DIR:/root/.cache/grype" \
            -v "$ARTIFACTS_DIR:/artifacts" \
            ghcr.io/anchore/grype:v0.115.0 \
            sbom:/artifacts/sbom.spdx.json -o json > "$ARTIFACTS_DIR/grype.json"

          docker run --rm \
            -v "$GRYPE_CACHE_DIR:/root/.cache/grype" \
            -v "$ARTIFACTS_DIR:/artifacts" \
            ghcr.io/anchore/grype:v0.115.0 \
            sbom:/artifacts/sbom.spdx.json -o sarif > "$ARTIFACTS_DIR/grype.sarif"

      - name: Run Trivy Scan
        run: |
          docker run --rm \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            -v "$ARTIFACTS_DIR:/artifacts" \
            aquasec/trivy:0.72.0 \
            sbom /artifacts/sbom.cdx.json --format json --output /artifacts/trivy.json

          docker run --rm \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            -v "$ARTIFACTS_DIR:/artifacts" \
            aquasec/trivy:0.72.0 \
            sbom /artifacts/sbom.cdx.json --format sarif --output /artifacts/trivy.sarif

      - name: Run OSV-Scanner
        run: |
          set +e
          docker run --rm \
            -v "$ARTIFACTS_DIR:/artifacts" \
            ghcr.io/google/osv-scanner:v2.4.0 \
            -L /artifacts/sbom.spdx.json --format json > "$ARTIFACTS_DIR/osv.json"
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then
            echo "❌ OSV-Scanner failed with exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Extract Target PURL
        id: product
        run: |
          PURL=$(jq -r '.metadata.component.purl // empty' "$ARTIFACTS_DIR/sbom.cdx.json")

          if [ -z "$PURL" ] || [ "$PURL" = "null" ]; then
            REGISTRY_PATH="${REGISTRY}/${IMAGE}"
            PURL=$(echo "pkg:oci/${REGISTRY_PATH}@${{ inputs.image_digest }}" | tr '[:upper:]' '[:lower:]')
          fi

          echo "purl=$PURL" >> "$GITHUB_OUTPUT"

      - name: Prepare VEX Policy
        run: |
          jq --arg purl "${{ steps.product.outputs.purl }}" \
            '.statements |= map(.products = [{ "@id": $purl }])' \
            security/policy/vex-policy.json > "$ARTIFACTS_DIR/vex.json"

      - name: Filter Scan Results with VEX
        run: |
          docker run --rm \
            -v "$ARTIFACTS_DIR:/artifacts" \
            ghcr.io/openvex/vexctl:c613023a69ce990a54c25c2f5e69d5d78285927f \
            filter /artifacts/trivy.sarif /artifacts/vex.json > "$ARTIFACTS_DIR/trivy-filtered.sarif"

          docker run --rm \
            -v "$ARTIFACTS_DIR:/artifacts" \
            ghcr.io/openvex/vexctl:c613023a69ce990a54c25c2f5e69d5d78285927f \
            filter /artifacts/grype.sarif /artifacts/vex.json > "$ARTIFACTS_DIR/grype-filtered.sarif"

      - name: Verify Filtered Security Gates
        run: |
          echo "### Security Compliance Metadata" >> $GITHUB_STEP_SUMMARY
          TRIVY_AFTER=$(jq '[.runs[].results[]?] | length' "$ARTIFACTS_DIR/trivy-filtered.sarif")
          GRYPE_AFTER=$(jq '[.runs[].results[]?] | length' "$ARTIFACTS_DIR/grype-filtered.sarif")

          echo "| Engine | Findings After VEX |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy** | $TRIVY_AFTER |" >> $GITHUB_STEP_SUMMARY
          echo "| **Grype** | $GRYPE_AFTER |" >> $GITHUB_STEP_SUMMARY

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL -o witness.tar.gz "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Generate Security Scan Attestation (Witness)
        id: witness-attestation
        run: |
          ATTESTATION_FILE="$ARTIFACTS_DIR/witness-security-scan.dsse.json"
          witness run \
            --step security-scan \
            --outfile "$ATTESTATION_FILE" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- bash -c "sha256sum '$ARTIFACTS_DIR'/*"

          echo "attestation_path=$ATTESTATION_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate Checksums & Sign
        run: |
          cd "$ARTIFACTS_DIR"
          shopt -s nullglob
          sha256sum *.{json,sarif} > checksums.txt
          sha256sum *.{json,sarif} | jq -R -s --arg ver "${{ inputs.version }}" '
            split("\n") | map(select(length > 0) | split("  ")) | map({(.[1]): .[0]}) | add
            | { version: $ver, artifacts: . }
          ' > checksums.json
          shopt -u nullglob

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Checksums File
        run: |
          cosign sign-blob \
            --yes \
            --bundle "$ARTIFACTS_DIR/checksums.txt.sigstore" \
            "$ARTIFACTS_DIR/checksums.txt"

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-artifacts
          path: ${{ env.ARTIFACTS_DIR }}/
          retention-days: 5