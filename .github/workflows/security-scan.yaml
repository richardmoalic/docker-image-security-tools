name: Security Scanning & Artifact Generation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-and-scan:
    name: Build, Scan & Attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Set up caching for vulnerability databases
      - name: Cache Vulnerability Databases
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy
            ~/.cache/grype
          key: ${{ runner.os }}-security-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-security-db-

      # 2. Build your reproducible, secure tool suite image
      - name: Build Tool-Suite Image
        run: |
          docker build \
            -t sec-tools:local \
            --target runtime \
            .

      # 3. Prepare workspace host paths to pull artifacts out of the container
      - name: Prepare Workspace Directories
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          mkdir -p ~/.cache/trivy ~/.cache/grype

      # 4. Extract generated SBOMs and VEX templates from the image
      - name: Extract Build Metadata
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint cp \
            sec-tools:local -r /artifacts/. /host-artifacts/


      - name: Inspect SBOM
        run: |
          echo "Inspect SNOM"
          jq '.metadata.component' artifacts/sbom.cdx.json

      # 5. Run Grype Scan
      - name: Run Grype Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/grype \
            sec-tools:local sbom:/host-artifacts/sbom.spdx.json -o json > ${{ github.workspace }}/artifacts/grype.json

      - name: Run Grype Sarif Report
        run: |
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/grype \
            sec-tools:local sbom:/host-artifacts/sbom.spdx.json -o sarif > ${{ github.workspace }}/artifacts/grype.sarif

      # 6. Run Trivy Scan
      - name: Run Trivy Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/trivy \
            sec-tools:local sbom /host-artifacts/sbom.cdx.json --format json --output /host-artifacts/trivy.json
      
      - name: Generate Trivy SARIF Report
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/trivy \
            sec-tools:local sbom /host-artifacts/sbom.cdx.json --format sarif --output /host-artifacts/trivy.sarif

      # 7. Run OSV-Scanner (New Step)
      - name: Run OSV-Scanner
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/osv-scanner \
            sec-tools:local --sbom /host-artifacts/sbom.spdx.json --format json > ${{ github.workspace }}/artifacts/osv.json || true

      - name: Extract Product PURL
        id: product
        run: |
          # Try to extract it from the SBOM metadata first
          PURL=$(jq -r '.metadata.component.purl // empty' "${{ github.workspace }}/artifacts/sbom.cdx.json")

          # Fallback: If the SBOM lacks a PURL, build it dynamically using the metadata name or inputs
          if [ -z "$PURL" ] || [ "$PURL" = "null" ]; then
            echo "⚠️ PURL not found in SBOM metadata. Constructing fallback OCI PURL..."
            
            # Extract image name from SBOM metadata, or fall back to repository path
            IMG_NAME=$(jq -r '.metadata.component.name // empty' "${{ github.workspace }}/artifacts/sbom.cdx.json")
            if [ -z "$IMG_NAME" ] || [ "$IMG_NAME" = "null" ]; then
              IMG_NAME="ghcr.io/${{ github.repository }}"
            fi

            # Clean up the image name if it already contains a tag or digest
            IMG_BASE=$(echo "$IMG_NAME" | cut -d':' -f1 | cut -d'@' -f1)
            
            # Construct standard OCI purl format (pkg:oci/name@digest or pkg:oci/name@tag)
            # Adjust the identifier component depending on whether you use inputs.image_digest or github.sha
            IDENTIFIER="${{ inputs.image_digest || github.sha }}"
            PURL="pkg:oci/${IMG_BASE#pkg:oci/}@${IDENTIFIER}"
          fi

          echo "Detected/Constructed PURL: $PURL"
          echo "purl=$PURL" >> "$GITHUB_OUTPUT"


      - name: Debug Product Purl
        run: |
          jq '.metadata.component.purl' artifacts/sbom.cdx.json

      - name: Debug Sarif Id
        run: |
          echo "Debug Sarif Id"
          jq -r '
          .runs[].results[]
          | .ruleId
          ' artifacts/trivy.sarif | sort -u | head -50

      - name: Inspect Sarif 
        run: |
          echo "Inspect sarif"
          jq '
          .runs[0].results[]
          | select(.ruleId=="CVE-2026-42499")
          ' artifacts/trivy.sarif


      - name: Debug SBOM PURL
        run: |
          echo "SBOM PURL:"
          jq -r '.metadata.component.purl' artifacts/sbom.cdx.json

      # 8. Prepare OpenVEX Policy
      - name: Prepare VEX Policy
        run: |
          jq \
            --arg purl "${{ steps.product.outputs.purl }}" \
            '
            .statements |= map(
              # Option A: Map to the corrected PURL
              .products = [{ "@id": $purl }]
              
              # Option B: UNCOMMENT BELOW if filtering still fails. 
              # It strips product constraints to match globally by CVE ID.
              # del(.products) 
            )
            ' \
            security/policy/vex-policy.json \
            > "${{ github.workspace }}/artifacts/vex.json"


      - name: Debug Product Id
        run: |
          echo "Debug Product Id"
          jq '.statements[0].products[0]."@id"' artifacts/vex.json 

      - name: Debug Compare Trivy And Vex 
        run: |
          echo "Debug Compare Trivy And Vex"
          comm -12 \
          <(jq -r '.runs[].results[].ruleId' artifacts/trivy.sarif | sort -u) \
          <(jq -r '.statements[].vulnerability.name' artifacts/vex.json | sort -u)


      - name: Debug Vulnerability
        run: |
          echo "Debug Vulnerability"
          jq -r '
          .statements[].vulnerability.name
          ' artifacts/vex.json | sort -u | head -50


      - name: Debug SBOM PURL
        run: |

          echo
          echo "VEX Product:"
          jq -r '.statements[0].products[0]."@id"' artifacts/vex.json

          echo
          echo "First 10 CVEs in VEX:"
          jq -r '.statements[].vulnerability.name' artifacts/vex.json | head


      # 9. Apply VEX Filtering
      - name: Filter Trivy SARIF with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              /host-artifacts/trivy.sarif \
              /host-artifacts/vex.json \
              > ${{ github.workspace }}/artifacts/trivy-filtered.sarif || true
              

      - name: Filter Grype Results with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              /host-artifacts/grype.sarif \
              /host-artifacts/vex.json \
              > ${{ github.workspace }}/artifacts/grype-filtered.sarif || true


      - name: Debug Remaining CVEs
        run: |
          echo "Remaining Trivy:"
          jq -r '.runs[].results[].ruleId' artifacts/trivy-filtered.sarif | head -30

          echo
          echo "Remaining Grype:"
          jq -r '.runs[].results[].ruleId' artifacts/grype-filtered.sarif | head -30

      - name: Debug Before After Trivy
        run: |
          echo "Trivy Before vex filtering:"
          jq '[.runs[].results[]] | length' artifacts/trivy.sarif

          echo "Trivy After vex filtering:"
          jq '[.runs[].results[]] | length' artifacts/trivy-filtered.sarif


      - name: Debug Before After Grype
        run: |
          echo "Grype Before vex filtering:"
          jq '[.runs[].results[]] | length' artifacts/grype.sarif

          echo "Grype After vex filtering:"
          q '[.runs[].results[]] | length' artifacts/grype-filtered.sarif


      - name: Verify Filtered Security Gates
        run: |
          echo "Evaluating remaining vulnerabilities after VEX statements applied..."
          
          # Count findings in the filtered SARIF structures
          TRIVY_REMAINING=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/artifacts/trivy-filtered.sarif)
          GRYPE_REMAINING=$(jq '[.runs[].results[]] | length' ${{ github.workspace }}/artifacts/grype-filtered.sarif)
          
          echo "Unresolved Trivy Vulnerabilities: $TRIVY_REMAINING"
          echo "Unresolved Grype Vulnerabilities: $GRYPE_REMAINING"
          
          if [ "$TRIVY_REMAINING" -gt 0 ] || [ "$GRYPE_REMAINING" -gt 0 ]; then
            echo "::error::Pre-publish gate failed! Unresolved vulnerabilities exist after VEX filtering."
            exit 1
          fi
          echo "Security gate clean. Proceeding to attestation and artifact generation."

      # 10. Generate Witness Evidence
      - name: Install Witness
        env:
          WITNESS_VERSION: v0.9.1 # Pin to your desired version
        run: |
          curl -fsSL \
            -o witness.tar.gz \
            "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"

          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      # 11. Generate Process Attestation (Witness)
      - name: Generate Process Attestation (Witness)
        run: |
          witness run \
            --step build \
            --outfile "${{ github.workspace }}/artifacts/witness.dsse.json" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- true

      # 11. Upload all resulting artifacts to the workflow run
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: ${{ github.workspace }}/artifacts/
          retention-days: 5

  release:
    name: Publish Production Release
    needs: build-and-scan
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/sbom.spdx.json
            ./release-artifacts/sbom.cdx.json
            ./release-artifacts/trivy.json
            ./release-artifacts/grype.json
            ./release-artifacts/vex.json
            ./release-artifacts/trivy-filtered.sarif
            ./release-artifacts/grype-filtered.sarif
            ./release-artifacts/osv.json
            ./release-artifacts/witness.dsse.json