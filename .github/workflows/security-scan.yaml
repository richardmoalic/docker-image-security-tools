name: Security Scanning & Artifact Generation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-and-scan:
    name: Build, Scan & Attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Set up caching for vulnerability databases
      - name: Cache Vulnerability Databases
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy
            ~/.cache/grype
          key: ${{ runner.os }}-security-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-security-db-

      # 2. Build your reproducible, secure tool suite image
      - name: Build Tool-Suite Image
        run: |
          docker build \
            -t sec-tools:local \
            --target runtime \
            .

      # 3. Prepare workspace host paths to pull artifacts out of the container
      - name: Prepare Workspace Directories
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          mkdir -p ~/.cache/trivy ~/.cache/grype

      # 4. Extract generated SBOMs and VEX templates from the image
      - name: Extract Build Metadata
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint cp \
            sec-tools:local -r /artifacts/. /host-artifacts/

      # 5. Run Grype Scan
      - name: Run Grype Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/grype:/root/.cache/grype \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/grype \
            sec-tools:local sbom:/host-artifacts/sbom.spdx.json -o json > ${{ github.workspace }}/artifacts/grype.json

      # 6. Run Trivy Scan
      - name: Run Trivy Vulnerability Scan
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/trivy \
            sec-tools:local sbom /host-artifacts/sbom.cdx.json --format json --output /host-artifacts/trivy.json

      # 7. Run OSV-Scanner (New Step)
      - name: Run OSV-Scanner
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/osv-scanner \
            sec-tools:local --sbom /host-artifacts/sbom.spdx.json --format json > ${{ github.workspace }}/artifacts/osv.json || true

      # 8. Apply VEX Filtering
            # 8. Generate OpenVEX Document
            # 8. Prepare OpenVEX Policy
      - name: Prepare VEX Policy
        run: |
          cp ./security/vex-policy.yaml ${{ github.workspace }}/artifacts/vex.json

          # Replace immutable product reference dynamically
          sed -i \
            "s#pkg:oci/ghcr.io/ricardo/sec-tools@latest#pkg:oci/ghcr.io/${{ github.repository }}@${{ github.sha }}#g" \
            ${{ github.workspace }}/artifacts/vex.json

      # 9. Validate VEX Document
            # 9. Validate OpenVEX Document
      - name: Validate VEX Document
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local validate \
              --vex /host-artifacts/vex.json


      # 10. Apply VEX Filtering
      - name: Filter Vulnerabilities with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              --vex /host-artifacts/vex.json \
              --input /host-artifacts/trivy.json \
              > ${{ github.workspace }}/artifacts/trivy-filtered.json

      - name: Filter Grype Results with VEX
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/vexctl \
            sec-tools:local filter \
              --vex /host-artifacts/vex.json \
              --input /host-artifacts/grype.json \
              > ${{ github.workspace }}/artifacts/grype-filtered.json

      # 9. Generate Witness Evidence
      - name: Generate Process Attestation (Witness)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/artifacts:/host-artifacts \
            --entrypoint /usr/local/bin/witness \
            sec-tools:local run \
              --step build \
              --materials /workspace \
              --out /host-artifacts/witness.dsse.json \
              true

      # 10. Upload all resulting artifacts to the workflow run
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: ${{ github.workspace }}/artifacts/
          retention-days: 5

  release:
    name: Publish Production Release
    needs: build-and-scan
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/sbom.spdx.json
            ./release-artifacts/sbom.cdx.json
            ./release-artifacts/grype.json
            ./release-artifacts/vex.json
            ./release-artifacts/trivy-filtered.json
            ./release-artifacts/grype-filtered.json
            ./release-artifacts/osv.json
            ./release-artifacts/witness.dsse.json