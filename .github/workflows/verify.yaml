name: Pre-Publish Verification Hook

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Cryptographic & Vulnerability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify Cosign Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"

      - name: Verify Attestation Signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}"

      - name: Setup Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: v0.72.0

      # 3. Execute directly with your target VEX policy controls
      - name: Scan Deployed Image with Trivy
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --vex security/vex-policy.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"

      - name: Scan Deployed Image with Grype
        uses: anchore/scan-action@v3
        with:
          image: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"
          fail-build: true
          severity-cutoff: high