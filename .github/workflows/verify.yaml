name: Pre-Publish Verification Hook

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Cryptographic & Vulnerability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify Cosign Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}"

      - name: Verify Attestation Signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}"

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-artifacts
          path: ./security-reports

      # 2. Gatekeeper: Parse the filtered SARIF data to guarantee zero unresolved alerts remain
      - name: Enforce VEX-Filtered Vulnerability Gate
        run: |
          echo "Checking filtered Trivy reports..."
          TRIVY_ERRORS=$(jq '.runs[].results | length' ./security-reports/trivy-filtered.sarif)
          
          echo "Checking filtered Grype reports..."
          GRYPE_ERRORS=$(jq '.runs[].results | length' ./security-reports/grype-filtered.sarif)
          
          echo "Trivy unresolved alerts post-VEX: $TRIVY_ERRORS"
          echo "Grype unresolved alerts post-VEX: $GRYPE_ERRORS"
          
          if [ "$TRIVY_ERRORS" -gt 0 ] || [ "$GRYPE_ERRORS" -gt 0 ]; then
            echo "::error::Pre-publish gate failed! Unresolved vulnerabilities exist after VEX filtering."
            exit 1
          fi
          
          echo "All security gates passed successfully."