name: Pre-Publish Verification Hook

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/build-artifacts
  SECURITY_ARTIFACTS_DIR: ${{ github.workspace }}/security-artifacts
  ATTEST_ARTIFACTS_DIR: ${{ github.workspace }}/attest-artifacts
  ARTIFACTS_DIR: ${{ github.workspace }}/verify-artifacts

jobs:
  verify:
    name: Cryptographic & Vulnerability Verification
    runs-on: ubuntu-latest
    env:
      TARGET_IMAGE: ghcr.io/${{ github.repository }}@${{ inputs.image_digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare Workspace Directory
        run: mkdir -p "$ARTIFACTS_DIR"
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: build-artifacts
          path: ${{ env.BUILD_ARTIFACTS_DIR }}

      - name: Download Security Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: security-artifacts
          path: ${{ env.SECURITY_ARTIFACTS_DIR }}

      - name: Download Attest Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: attest-artifacts
          path: ${{ env.ATTEST_ARTIFACTS_DIR }}

      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checksums
        run: |
          cd "$SECURITY_ARTIFACTS_DIR"
          sha256sum -c checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 #v4.1.0

      - name: Verify Cosign Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$TARGET_IMAGE"

      - name: Verify Attestation Signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$TARGET_IMAGE" \
            --owner "${{ github.repository_owner }}"

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL \
            -o witness.tar.gz \
            "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"

          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Generate Verify Step Attestation (Witness)
        run: |
          witness run \
            --step verify \
            --outfile "$ARTIFACTS_DIR/witness-verify.dsse.json" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- true

      - name: Verify Witness Attestations Against Policy
        run: |
          witness verify \
            --policy security/policy/in-toto.signed.json
            --attestation "$BUILD_ARTIFACTS_DIR/witness-build.dsse.json" \
            --attestation "$SECURITY_ARTIFACTS_DIR/witness-security-scan.dsse.json" \
            --attestation "$ATTEST_ARTIFACTS_DIR/witness-attest.dsse.json" \
            --attestation "$ARTIFACTS_DIR/witness-verify.dsse.json"

      - name: Upload Verify Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: verify-artifacts
          path: ${{ env.ARTIFACTS_DIR }}/
          retention-days: 5