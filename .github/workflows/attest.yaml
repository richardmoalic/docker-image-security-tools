name: Cryptographic Attestation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string

    outputs:
      target_image:
        description: "The full OCI image reference with digest that was signed and attested"
        value: ${{ jobs.attest.outputs.target_image }}
      attestation_path:
        description: "Path to the generated Witness attestation DSSE envelope"
        value: ${{ jobs.attest.outputs.attestation_path }}

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  attest:
    name: Sign & Attest Metadata
    runs-on: ubuntu-latest
    env:
      TARGET_IMAGE: ghcr.io/${{ github.repository }}@${{ inputs.image_digest }}
    outputs:
      target_image: ${{ env.TARGET_IMAGE }}
      attestation_path: ${{ steps.witness-attest.outputs.attestation_path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare Workspace Directory
        run: mkdir -p "$ARTIFACTS_DIR"

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Download Security Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign OCI Digest Directly
        run: cosign sign --yes "$TARGET_IMAGE"

      - name: Attach Cosign Attestations to OCI Index
        run: |
          cosign attach sbom --sbom "$ARTIFACTS_DIR/sbom.spdx.json" "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/sbom.cdx.json" --type cyclonedx "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/grype-filtered.sarif" --type vuln "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/trivy-filtered.sarif" --type vuln "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/osv.json" --type vuln "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/vex.json" --type openvex "$TARGET_IMAGE"
          cosign attest --yes --predicate "$ARTIFACTS_DIR/checksums.json" --type https://in-toto.io/Statement/v0.1 "$TARGET_IMAGE"

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ inputs.image_digest }}
          push-to-registry: true

      - name: Generate GitHub SBOM Attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ inputs.image_digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: ${{ env.ARTIFACTS_DIR }}/sbom.spdx.json
          push-to-registry: true

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL -o witness.tar.gz "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Generate Attest Step Attestation (Witness)
        id: witness-attest
        run: |
          ATTESTATION_FILE="$ARTIFACTS_DIR/witness-attest.dsse.json"
          witness run \
            --step attest \
            --outfile "$ATTESTATION_FILE" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- bash -c "echo 'Attested target: ${{ env.TARGET_IMAGE }}' > '$ARTIFACTS_DIR/attested-target.txt'"

          echo "attestation_path=$ATTESTATION_FILE" >> "$GITHUB_OUTPUT"

      - name: Attach Witness Attestations to Container Image
        run: |
          for dsse in "$ARTIFACTS_DIR"/witness-*.dsse.json; do
            if [ -f "$dsse" ]; then
              cosign attest --yes --predicate "$dsse" --type https://in-toto.io/Statement/v0.1 "$TARGET_IMAGE"
            fi
          done

      - name: Upload Attest Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attest-artifacts
          path: ${{ env.ARTIFACTS_DIR }}/
          retention-days: 5