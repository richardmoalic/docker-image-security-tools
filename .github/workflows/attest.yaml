name: Cryptographic Attestation

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  attest:
    name: Sign & Attest Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Workspace Directory
        run: mkdir -p ${{ github.workspace }}/attest-artifacts

      - name: Download Security Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: security-artifacts
          path: ${{ github.workspace }}/security-artifacts

      - name: Log in to Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      # Sign the immutable digest directly
      - name: Sign OCI Image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach SPDX SBOM
        run: cosign attach sbom --sbom ${{ github.workspace }}/security-artifacts/sbom.spdx.json "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach CycloneDX Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts/sbom.cdx.json --type cyclonedx "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach Grype Vulnerability Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//grype-filtered.sarif --type vuln "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach Trivy Vulnerability Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//trivy-filtered.sarif --type vuln "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach OSV Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//osv.json --type vuln "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach OpenVEX Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//vex.json --type openvex "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"

      - name: Attach Witness Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//witness.dsse.json --type https://witness.dev/attestation/v0.1 "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ inputs.image_digest }}"
      
      - name: Attach Checksums Attestation
        run: cosign attest --yes --predicate ${{ github.workspace }}/security-artifacts//checksums.json --type https://in-toto.io/Statement/v0.1

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 #v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ inputs.image_digest }}
          push-to-registry: true

      - name: Generate GitHub SBOM Attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 #v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ inputs.image_digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: ${{ github.workspace }}/security-artifacts//sbom.spdx.json
          push-to-registry: true

      - name: Install Witness
        env:
          WITNESS_VERSION: v0.12.0
        run: |
          curl -fsSL \
            -o witness.tar.gz \
            "https://github.com/in-toto/witness/releases/download/${WITNESS_VERSION}/witness_${WITNESS_VERSION#v}_linux_amd64.tar.gz"

          tar -xzf witness.tar.gz
          chmod +x witness
          sudo mv witness /usr/local/bin/

      - name: Generate Attest Step Attestation (Witness)
        run: |
          witness run \
            --step attest \
            --outfile "${{ github.workspace }}/attest-artifacts/witness-attest.dsse.json" \
            --signer-fulcio-url https://fulcio.sigstore.dev \
            --signer-fulcio-oidc-client-id sigstore \
            --signer-fulcio-oidc-issuer https://oauth2.sigstore.dev/auth \
            --timestamp-servers https://freetsa.org/tsr \
            -- true

      - name: Upload attest Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: attest-artifacts
          path: ${{ github.workspace }}/attest-artifacts/
          retention-days: 5