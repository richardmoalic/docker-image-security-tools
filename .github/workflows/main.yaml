name: Production Pipeline Orchestrator

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: 1. Build Stage
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      packages: write

  security-scan:
    name: 2. Security Scanning Stage
    needs: build
    uses: ./.github/workflows/security-scan.yaml
    permissions:
      contents: read
    with:
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ needs.build.outputs.version }}

  attest:
    name: 3. Attestation Stage
    needs: [build, security-scan]
    uses: ./.github/workflows/attest.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ needs.build.outputs.version }}

  verify:
    name: 4. Verification Stage
    needs: [build, attest]
    uses: ./.github/workflows/verify.yaml
    permissions:
      packages: read
      id-token: write
    with:
      image_digest: ${{ needs.build.outputs.digest }}

  publish:
    name: 5. Publish Stage
    needs: [build, verify]
    uses: ./.github/workflows/publish.yaml
    permissions:
      contents: write
      packages: write
    with:
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ needs.build.outputs.version }}